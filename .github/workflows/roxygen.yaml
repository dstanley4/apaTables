# Fails when the committed NAMESPACE, DESCRIPTION or man/ pages differ from
# what roxygen2 writes from the R/ source, e.g. after a tag was edited and
# the documentation was not rebuilt. It installs the roxygen2 version named
# in DESCRIPTION (Config/roxygen2/version), so a new roxygen2 release on
# CRAN cannot fail it; moving to a new version is done locally.
on:
  push:
    branches: [main, master]
  pull_request:

name: roxygen.yaml

permissions: read-all

jobs:
  roxygen:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload

      - name: Install the roxygen2 version named in DESCRIPTION
        run: |
          v <- read.dcf("DESCRIPTION", fields = "Config/roxygen2/version")[1, 1]
          pak::pkg_install(paste0("roxygen2@", v))
        shell: Rscript {0}

      - name: Rebuild the documentation
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Fail if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::The committed files differ from what roxygen2 writes. Run roxygen2::roxygenise() and commit the result."
            exit 1
          fi
